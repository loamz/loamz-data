<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" width="1000" height="880" role="img" aria-label="An organization decides who may use which workspace. A workspace is a project: members, service principals and AI agents work there; compute runs jobs, serverless SQL and sandboxes; every read asks a catalog first. Each catalog has governance (metadata, grants, audit) over its storage: Iceberg tables and files in your S3-compatible bucket.">
