<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1288 966" width="1288" height="966" role="img" aria-label="Apps act as a principal. In a workspace, governance (grants, policies, audit) is a layer over four things: who (principals: members and service principals), compute (jobs, serverless SQL, sandboxes), data (catalog, schema, tables, volumes, functions, MLflow) and storage (credentials, locations, roots). A principal runs work on compute; compute asks the catalog and governance gives short-lived, scoped access; compute reads and writes the bytes in storage directly.">
