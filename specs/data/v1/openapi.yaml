openapi: 3.1.0
info:
  title: Loamz Data
  version: 1.0.0
  description: The governed data API. Every call carries a Keycloak bearer token for the audience `loamz-data`, and is checked by IAM; every refusal
    and change is recorded in the organization's audit chain. Errors are RFC 9457 problem documents. A caller who may not see a thing is told
    it does not exist (404), never that it is forbidden.
servers:
- url: /
security:
- bearer: []
paths:
  /healthz:
    get:
      summary: The process is up.
      parameters: []
      responses:
        '200':
          description: OK
      security: []
  /metrics:
    get:
      summary: What the server says about itself for a monitoring system (Prometheus text). Needs the scrape token; without one configured there is no such route.
      parameters: []
      responses:
        '200':
          description: Request counts and times, and the runs waiting and running
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /readyz:
    get:
      summary: The database answers.
      parameters: []
      responses:
        '200':
          description: OK
        '500':
          $ref: '#/components/responses/Problem'
      security: []
  /api/v1/me:
    get:
      summary: Who the token says the caller is, their organizations (including their own space) and the workspaces they can open.
      parameters: []
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Problem'
      description: A person's own space and a workspace in it are made on first use.
  /api/v1/orgs:
    post:
      summary: Make an organization and its first admin. Only the installation's admin (the Keycloak role `platform-admin`) can.
      description: The first admin is made in the directory if new, with a temporary password shown once in the answer; they must change
        it at their first sign-in. Asking again for an organization that exists is a conflict.
      parameters: []
      responses:
        '201':
          description: Created
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrganization'
  /api/v1/orgs/{org}/account:
    post:
      summary: Create the Data account of an organization the caller belongs to. Needs the Keycloak role `account-admin`; the creator becomes
        its first admin.
      parameters:
      - &id001
        name: org
        in: path
        required: true
        schema:
          type: string
        description: 'An organization id: the Keycloak organization id, or personal:<subject> for your own space.'
      responses:
        '201':
          description: Created
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/orgs/{org}/admins:
    get:
      summary: Who manages the account (account admins).
      parameters:
      - *id001
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      summary: Make a principal an account admin.
      parameters:
      - *id001
      responses:
        '204':
          description: Added
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Principal'
  /api/v1/orgs/{org}/admins/{principal}:
    delete:
      summary: Take away admin rights. An account always keeps one admin.
      parameters:
      - *id001
      - &id003
        name: principal
        in: path
        required: true
        schema:
          type: string
        description: user:<id>, group:<path> or sp:<id>, percent-encoded.
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/orgs/{org}/people:
    post:
      summary: Add a person to the organization. Account admins only.
      description: A person who already exists is only added. A new one is made with a temporary password, shown once in the answer.
      parameters:
      - *id001
      responses:
        '201':
          description: Added
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPerson'
  /api/v1/orgs/{org}/workspaces:
    get:
      summary: The workspaces of the organization the caller can open.
      parameters:
      - *id001
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      summary: Create a workspace. Account admins only; the creator becomes its admin.
      parameters:
      - *id001
      responses:
        '201':
          description: Created
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Name'
  /api/v1/workspaces/{ws}:
    get:
      summary: One workspace, and the caller's standing in it.
      parameters:
      - &id002
        name: ws
        in: path
        required: true
        schema:
          type: string
        description: A workspace id.
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      summary: Rename a workspace (account admins).
      parameters:
      - *id002
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Name'
    delete:
      summary: Delete a workspace and its assignments. A workspace that still owns catalogs cannot be deleted.
      parameters:
      - *id002
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{ws}/members:
    get:
      summary: Who is assigned to the workspace, and as what. Workspace admins.
      parameters:
      - *id002
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      summary: Assign a person, group or service principal as `admin` or `user`, or change their role.
      parameters:
      - *id002
      responses:
        '204':
          description: Assigned
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Assign'
  /api/v1/workspaces/{ws}/members/{principal}:
    delete:
      summary: Take a principal out of the workspace. A workspace keeps one admin.
      parameters:
      - *id002
      - *id003
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{ws}/service-principals:
    get:
      summary: The workspace's service principals (never their tokens). Workspace admins.
      parameters:
      - *id002
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      summary: Make a service principal (a BI tool, an ML app, a pipeline) of this workspace. Workspace admins.
      description: Its token is in the answer, once. It starts with `lsp_`, is sent as a bearer token like any other, and opens only this
        workspace. The principal is `sp:<id>`; give it grants and entitlements like anyone's.
      parameters:
      - *id002
      responses:
        '201':
          description: Created
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Name'
  /api/v1/workspaces/{ws}/service-principals/{id}:
    delete:
      summary: Remove a service principal; its token stops working at once.
      parameters:
      - *id002
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{ws}/service-principals/{id}/token:
    post:
      summary: Give a service principal a new token (in the answer, once); the old one stops working at once.
      parameters:
      - *id002
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{ws}/storage/credentials:
    get:
      summary: List storage credentials without secret material. Workspace admins.
      parameters:
      - *id002
      responses:
        '200':
          description: Credential metadata
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/StorageCredential'}
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      summary: Create a storage credential with a write-only secret. Workspace admins.
      parameters:
      - *id002
      responses:
        '201':
          description: Credential created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StorageCredential'}
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewStorageCredential'
  /api/v1/workspaces/{ws}/storage/credentials/{id}:
    get:
      summary: Read non-secret credential metadata.
      parameters:
      - *id002
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Credential metadata
          headers:
            ETag: {description: Strong generation tag for If-Match, schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StorageCredential'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      summary: Remove a credential no location uses.
      parameters:
      - *id002
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{ws}/storage/credentials/{id}/check:
    post:
      summary: Check a location without returning the credential.
      parameters:
      - *id002
      - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location_id]
              properties:
                location_id: {type: string}
      responses:
        '200':
          description: Usable, denied or unavailable at the checked generation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StorageCheck'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{ws}/storage/credentials/{id}/secret:
    put:
      summary: Replace the complete secret if the generation matches.
      parameters:
      - *id002
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: If-Match, in: header, required: true, schema: {type: string}, description: The strong ETag returned by GET.}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StorageSecret'}
      responses:
        '204': {description: Secret replaced}
        '400': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/workspaces/{ws}/storage/locations:
    get:
      summary: The buckets and prefixes this workspace may use. Workspace admins.
      parameters:
      - *id002
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      summary: Approve a bucket or a prefix of one. It may overlap no other location of the installation. Workspace admins.
      parameters:
      - *id002
      responses:
        '201':
          description: Created
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewStorageLocation'
  /api/v1/workspaces/{ws}/storage/locations/{id}:
    delete:
      summary: Remove a location.
      parameters:
      - *id002
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{ws}/entitlements:
    get:
      summary: What assigned principals are entitled to.
      parameters:
      - *id002
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      summary: Give an entitlement (`sql-access`, `compute-create`, `sandbox-access`) to an assigned principal.
      parameters:
      - *id002
      responses:
        '204':
          description: Given
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Entitle'
  /api/v1/workspaces/{ws}/entitlements/{principal}/{entitlement}:
    delete:
      summary: Take an entitlement away.
      parameters:
      - *id002
      - *id003
      - name: entitlement
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Removed
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{ws}/securables:
    post:
      summary: Create a catalog, schema, table, volume or view. Needs the matching CREATE privilege on the parent (CREATE CATALOG on the metastore).
        The creator owns it.
      parameters:
      - *id002
      responses:
        '201':
          description: Created
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecurable'
    get:
      summary: List what is directly inside a parent (the metastore when `parent_id` is empty) that the caller may see from this workspace.
      parameters:
      - *id002
      - name: parent_id
        in: query
        required: false
        schema:
          type: string
        description: Empty for catalogs.
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{ws}/securables/{id}:
    get:
      summary: One entry.
      parameters:
      - *id002
      - &id004
        name: id
        in: path
        required: true
        schema:
          type: string
        description: A securable id, or `metastore` where grants are concerned.
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      summary: Drop an entry and everything inside it. Needs MANAGE. The entry disappears at once; the bytes are removed by a durable task.
      parameters:
      - *id002
      - *id004
      responses:
        '202':
          description: A drop task was queued
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{ws}/securables/{id}/owner:
    put:
      summary: Hand an entry to a new owner. Needs MANAGE.
      parameters:
      - *id002
      - *id004
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Owner'
  /api/v1/workspaces/{ws}/securables/{id}/policy:
    get:
      summary: The row filter and column masks of a table (empty when it has none). Needs MANAGE.
      parameters:
      - *id002
      - *id004
      responses:
        '200':
          description: "{row_filter, masks}"
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      summary: >-
        Set the rules of a table, replacing any before them; an empty body removes them. `row_filter` keeps only the rows where it is
        true; `masks` shows an expression in place of a column. A rule may use columns, values, a few plain functions,
        `current_principal()` and `in_group('name')`; anything else is refused. Whoever manages the table sees it whole; everyone
        else reads it only through SQL on Loamz compute, where the rules are applied (a job or an Iceberg client is refused).
        Needs MANAGE.
      parameters:
      - *id002
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                row_filter:
                  type: string
                masks:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{ws}/securables/{id}/grants:
    get:
      summary: Who holds what directly here. Needs MANAGE.
      parameters:
      - *id002
      - *id004
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      summary: Give a principal a role (reader, contributor, owner) here. The USE privileges are placed on the catalog and schema above. Needs
        MANAGE.
      parameters:
      - *id002
      - *id004
      responses:
        '204':
          description: Granted
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRole'
  /api/v1/workspaces/{ws}/securables/{id}/grants/{principal}:
    delete:
      summary: Take away everything a principal holds directly here. Needs MANAGE.
      parameters:
      - *id002
      - *id004
      - *id003
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{ws}/volumes/{id}/files:
    get:
