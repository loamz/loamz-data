            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                cron:
                  type: string
                interval_seconds:
                  type: integer
                  minimum: 60
                  maximum: 31536000
                sql:
                  type: string
                job:
                  type: object
                webhook_ref:
                  type: string
      responses:
        '201':
          description: Created schedule metadata, without its definition or webhook reference.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{ws}/schedules/{id}/pause:
    put:
      summary: Pause a schedule. Its owner or a workspace admin.
      parameters:
      - *id007
      - &scheduleId
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Paused
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{ws}/schedules/{id}/resume:
    put:
      summary: Resume a schedule from its next future firing. Its owner or a workspace admin.
      parameters:
      - *id007
      - *scheduleId
      responses:
        '204':
          description: Resumed
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{ws}/schedules/{id}:
    delete:
      summary: Delete a schedule. Its owner or a workspace admin.
      parameters:
      - *id007
      - *scheduleId
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{ws}/schedules/{id}/alerts:
    get:
      summary: List recorded failure alerts for a schedule.
      parameters:
      - *id007
      - *scheduleId
      responses:
        '200':
          description: Alert status and timestamps; no webhook destination is included.
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{ws}/runs/{id}:
    get:
      summary: One run, with its history and, when authorized, its rows and output.
      description: 'When input access cannot be verified, result_access is restricted and results, logs, errors and input metadata are omitted. A directly submitted SQL statement remains visible to its submitter. Full details use result_access=available.'
      parameters:
      - *id007
      - &id008
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The run with result_access indicating whether output is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetails'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{ws}/runs/{id}/cancel:
    post:
      summary: 'Stop a run: at once if it has not started, otherwise when its compute next checks in.'
      parameters:
      - *id007
      - *id008
      responses:
        '202':
          description: Stopping
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{ws}/compute/targets/{id}:
    delete:
      summary: Remove compute. What was waiting or running on it fails. Workspace admins.
      parameters:
      - *id002
      - *id008
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{ws}/compute/targets/{id}/secret:
    post:
      summary: Give the compute a new secret; the agent using the old one is turned away. Workspace admins.
      parameters:
      - *id002
      - *id008
      responses:
        '200':
          description: The new secret, once
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/agent/lease:
    post:
      summary: An agent asks for its next piece of work.
      description: 'Waits up to 20 seconds (or `wait_s`, at most 25) for work. The answer carries a run and the token that run''s files are read
        and written with: the person it runs for, narrowed to the tables and volumes it declared, for this workspace only, and dead when the run
        ends.'
      security: &id010
      - agent: []
      parameters:
      - name: wait_s
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: A run and its token
          content:
            application/json:
              schema:
                type: object
                required: [run, token, limits, storage]
                properties:
                  run:
                    type: object
                    required: [id, kind, org_id, target_id, workspace_id, spec]
                    properties:
                      id: {type: string}
                      kind: {type: string}
                      org_id: {type: string}
                      target_id: {type: string}
                      workspace_id: {type: string}
                      spec: {type: object}
                  token: {type: string}
                  limits: {type: object}
                  storage: {type: object, nullable: true}
        '204':
          description: Nothing is waiting
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/agent/runs/{id}/heartbeat:
    post:
      summary: An agent says it is still working on a run, and hears whether it was cancelled.
      security: *id010
      parameters:
      - *id008
      responses:
        '200':
          description: '`cancel` says whether to stop'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/agent/runs/{id}/complete:
    post:
      summary: An agent says how a run ended, with its rows or output.
      security: *id010
      parameters:
      - *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Report'
      responses:
        '204':
          description: Recorded
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    agent:
      type: http
      scheme: bearer
      description: "A compute agent's own secret (agt_\u2026), shown once when the compute is attached."
  responses:
    Problem:
      description: An RFC 9457 problem document.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RunDetails:
      type: object
      required:
      - id
      - kind
      - state
      - result_access
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [sql, job]
        state:
          type: string
        result_access:
          type: string
          enum: [available, restricted]
        spec:
          type: object
        stdout:
          type: string
        stderr:
          type: string
        result:
          type: object
          nullable: true
      additionalProperties: true
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - detail
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Principal:
      type: object
      required:
      - principal
      properties:
        principal:
          type: string
    NewOrganization:
      type: object
      required:
      - alias
      - admin_email
      - admin_name
      properties:
        alias:
          type: string
          description: 2 to 40 lower-case letters, digits or dashes.
        admin_email:
          type: string
        admin_name:
          type: string
    NewPerson:
      type: object
      required:
      - email
      - name
      properties:
        email:
          type: string
        name:
          type: string
    StorageCheck:
      type: object
      required: [status, generation]
      properties:
        status: {type: string, enum: [usable, denied, unavailable]}
        generation: {type: integer, format: int64, minimum: 1}
    StorageCredential:
      type: object
      required: [id, name, provider, endpoint, region, generation, created_by, created_ms]
      properties:
        id: {type: string}
        name: {type: string}
        provider: {type: string, enum: [rustfs], description: Other providers await conformance.}
        endpoint: {type: string}
        region: {type: string}
        generation: {type: integer, format: int64, minimum: 1}
        created_by: {type: string}
        created_ms: {type: integer, format: int64}
    NewStorageCredential:
      type: object
      additionalProperties: false
      required: [name, provider, endpoint, secret]
      properties:
        name: {type: string}
        provider: {type: string, enum: [rustfs], description: Other providers await conformance.}
        endpoint: {type: string}
        region: {type: string}
        secret: {$ref: '#/components/schemas/StorageSecret'}
    StorageSecret:
      type: object
      writeOnly: true
      additionalProperties: false
      required: [kind, access_key_id, secret_access_key]
      properties:
        kind: {type: string, enum: [sts]}
        access_key_id: {type: string, writeOnly: true}
        secret_access_key: {type: string, writeOnly: true}
    NewStorageLocation:
      type: object
      required:
      - name
      - credential_id
      - bucket
      properties:
        name:
          type: string
        credential_id:
          type: string
        bucket:
          type: string
        prefix:
          type: string
          description: A folder in the bucket, with no leading or trailing slash; empty is the whole bucket.
    Name:
      type: object
      required:
      - name
      properties:
        name:
          type: string
    Assign:
      type: object
      required:
      - principal
      - role
      properties:
        principal:
          type: string
        role:
          enum:
          - admin
          - user
    Entitle:
      type: object
      required:
      - principal
      - entitlement
      properties:
        principal:
          type: string
        entitlement:
          enum:
          - sql-access
          - compute-create
          - sandbox-access
    CreateSecurable:
      type: object
      required:
      - kind
      - name
      properties:
        kind:
          enum:
          - catalog
          - schema
          - table
          - volume
          - view
        parent_id:
          type: string
        name:
          type: string
          description: Lower case letters, digits and underscores, starting with a letter.
        classification:
          enum:
          - normal
          - personal
          - sealed
        placement:
          enum:
          - local
        consistency:
          enum:
          - transaction
          - snapshot
          description: A volume can only promise snapshot.
        location:
          type: string
          description: A catalog only. The name of one of the workspace's storage locations (in the installation's own bucket) to keep its data in. Leave empty for the workspace's default storage. Workspace admins only.
    Owner:
      type: object
      required:
      - owner
      properties:
        owner:
          type: string
    GrantRole:
      type: object
      required:
      - principal
      - role
      properties:
        principal:
          type: string
        role:
          enum:
          - reader
          - contributor
          - owner
    Erase:
      type: object
      required:
      - subject
      properties:
        subject:
          type: string
          description: A typed principal such as user:<id>.
    TokenRequest:
      type: object
      required:
      - grant_type
      properties:
        grant_type:
          enum:
          - authorization_code
          - refresh_token
        code:
          type: string
        redirect_uri:
          type: string
        code_verifier:
          type: string
        refresh_token:
          type: string
    Statement:
      type: object
      required:
      - sql
      properties:
        sql:
          type: string
        limit:
          type: integer
          description: Rows to return, at most 10000 (default 1000).
        target:
          type: string
        wait_s:
          type: integer
          description: Seconds to wait for the answer, at most 60 (default 30).
    Job:
      type: object
      required:
      - script
      properties:
        title:
          type: string
        script:
          type: string
        inputs:
          type: array
          items:
            type: string
          description: Table or volume ids, mounted read-only under /inputs/<name>.
        output:
          type: string
          description: 'A volume id: what the script leaves in /workspace is saved there under runs/<run id>/. Leave it out when the job only writes tables.'
        table_writes:
          type: array
          items:
            type: string
          description: >-
            Tables the script may write, as catalog.schema.table: one that exists (needs MODIFY) or one to create (needs CREATE TABLE on
            its schema). The sandbox has no network; it reaches the catalog's routes for these tables and storage for their folders through
            two narrow doors (see proposal 0005). A table with row or column rules cannot be written.
        target:
          type: string
        memory_mb:
          type: integer
        cpu_millis:
          type: integer
        timeout_s:
          type: integer
    Target:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        max_memory_mb:
          type: integer
          description: Default 2048.
        max_cpu_millis:
          type: integer
          description: Default 1000.
    Report:
      type: object
      required:
      - state
      properties:
        state:
          enum:
          - succeeded
          - failed
          - cancelled
          - timed_out
        exit_code:
          type: integer
        stdout:
          type: string
        stderr:
          type: string
        result:
          type: string
          description: A statement's rows, as JSON text.
        error:
          type: string
