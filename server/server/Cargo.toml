[package]
name = "loamz-data-server"
description = "Loamz Data: the governed API in front of storage."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "loamz_data_server"

[[bin]]
name = "loamz-data"
path = "src/main.rs"

[dependencies]
loamz-lake = { path = "../lake" }
axum = "0.8"
futures-util = "0.3"
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
base64 = "0.22"
http-body-util = "0.1"
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
tower = { version = "0.5", features = ["util"] }
serde_yaml = "0.9"

[lints]
workspace = true
