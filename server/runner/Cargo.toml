[package]
name = "loamz-runner"
description = "Loamz Data sandbox runner: builds the sandbox's OCI config with its limits, checks them, runs with a hard kill."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "loamz-runner"
path = "src/main.rs"

[dependencies]
futures = "0.3"
object_store = { version = "0.14.2", default-features = false, features = ["aws-base", "reqwest", "ring"] }
# Unify object_store's reqwest 0.13 TLS backend with the existing ring provider.
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "rt-multi-thread", "macros", "fs", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
