[package]
name = "loamz-worker"
description = "Isolated DuckDB execution for Loamz Data"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

# Its own workspace: see the root Cargo.toml. It keeps its own Cargo.lock and target folder.
[workspace]

[dependencies]
# Linked to DuckDB's own prebuilt library (DUCKDB_LIB_DIR, see scripts/fetch-duckdb.sh), not compiled from source: no `bundled`.
duckdb = { version = "=1.20000.1", features = ["vtab-arrow"] }
# The IPC writer for a statement's whole result (the same Arrow version DuckDB hands out).
arrow-ipc = "60"
# Parquet for a result kept in a person's volume (Snappy: no C library to build).
parquet = { version = "60", default-features = false, features = ["arrow", "snap"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# A small, single static binary matters more here than build time.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
