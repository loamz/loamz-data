[package]
name = "loamz-lake"
description = "Loamz Data storage: one database layer for SQLite and Postgres, and volumes on a POSIX path."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "migrate", "macros"] }
bytes = "1"
futures = "0.3"
http = "1"
object_store = { version = "0.14.2", default-features = false, features = ["aws-base", "reqwest", "ring"] }
# Unify object_store's reqwest 0.13 TLS backend with the existing ring provider.
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "rt"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
