[workspace]
resolver = "2"
members = ["server/lake", "server/runner", "server/server"]
# The SQL worker embeds DuckDB, compiled from C++ source (ten minutes or more, a lot of CPU and disk). It is its own workspace, so
# `cargo check --workspace` (an editor does this on every save) never builds it. Build it on purpose: `make worker`.
exclude = ["server/worker"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# A small, single static binary matters more here than build time.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Key generation in tests is slow unoptimised.
[profile.dev.package.num-bigint-dig]
opt-level = 3
