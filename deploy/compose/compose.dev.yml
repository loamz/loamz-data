# Run the Data workspace from the checkout alongside the built Data services.
services:
  data-workspace:
    image: node:22-bookworm-slim
    working_dir: /repo/apps/data-workspace
    command: ["./node_modules/.bin/next", "dev", "-H", "0.0.0.0", "-p", "3011"]
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    volumes:
      - ../..:/repo
    healthcheck:
      disable: true
