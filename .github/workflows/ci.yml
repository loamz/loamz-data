name: Data CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: data
          POSTGRES_PASSWORD: data-dev-only
          POSTGRES_DB: data
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U data"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          -c max_connections=400
    env:
      LOAMZ_TEST_POSTGRES_URL: postgres://data:data-dev-only@127.0.0.1:5432/data
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the repository Rust toolchain
        run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests (SQLite)
        run: cargo test --workspace --locked
      - name: Server integration tests (PostgreSQL)
        run: cargo test --locked -p loamz-data-server -- --include-ignored --test-threads=4

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build
      - name: Install Chromium for browser smoke
        run: pnpm exec playwright install --with-deps chromium
      - name: Run history browser smoke (fixture API)
        run: pnpm test:browser
      - name: Audit frontend dependencies
        run: pnpm audit --prod

  s3-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup show
      - name: Start isolated S3-compatible storage
        run: |
          docker run --rm -d --name loamz-test-s3 --tmpfs /tmp/loamz-s3:size=256m -p 127.0.0.1:8333:8333 chrislusf/seaweedfs:4.48 mini -dir=/tmp/loamz-s3 -bucket=loamz-test
          for attempt in $(seq 1 45); do
            if curl -fsS 'http://127.0.0.1:8333/loamz-test?list-type=2' > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs loamz-test-s3
          exit 1
      - name: Verify S3 storage operations
        env:
          LOAMZ_TEST_S3_ENDPOINT: http://127.0.0.1:8333
        run: cargo test --locked -p loamz-lake --test s3_live -- --ignored
      - name: Remove test storage
        if: always()
        run: docker rm -f loamz-test-s3 || true

  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup show
      - name: Prepare gVisor and sandbox filesystem
        run: |
          scripts/fetch-runsc.sh /tmp/loamz-ci-runsc
          server/runner/rootfs/build.sh /tmp/loamz-ci-rootfs
      - name: Build sandbox tests
        run: |
          cargo test --locked -p loamz-runner --test gvisor --no-run --message-format=json > /tmp/loamz-gvisor-build.jsonl
          python3 -c 'import json; p=[o["executable"] for line in open("/tmp/loamz-gvisor-build.jsonl") if (o:=json.loads(line)).get("target",{}).get("name")=="gvisor" and o.get("executable")]; assert len(p)==1, p; print(p[0])' > /tmp/loamz-gvisor-test-path
      - name: Verify sandbox isolation and cgroup limits
        run: |
          sudo env LOAMZ_RUNSC=/tmp/loamz-ci-runsc LOAMZ_ROOTFS=/tmp/loamz-ci-rootfs LOAMZ_PLATFORM=ptrace "$(cat /tmp/loamz-gvisor-test-path)" --ignored --test-threads=1

  rust-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup show
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: audit-cache
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.1-${{ runner.os }}-${{ runner.arch }}
      - if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.1
      # rsa is currently used only by the local test-key generator (and is locked for an unused SQLx backend).
      # Fail if it ever becomes a runtime or build dependency; the upstream timing advisory has no fixed release.
      - name: Keep the test-only RSA crate out of deployed code
        run: |
          cargo tree --locked --workspace --all-features --target all --edges normal,build --prefix none > /tmp/loamz-runtime-dependencies
          if grep -q '^rsa v' /tmp/loamz-runtime-dependencies; then
            echo 'rsa is now a runtime or build dependency; review RUSTSEC-2023-0071'
            exit 1
          fi
      - run: cargo audit --file Cargo.lock --ignore RUSTSEC-2023-0071

  supply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check dependency licenses, bans, and advisories
        uses: EmbarkStudios/cargo-deny-action@e9b251cfcf0d7f4be812d46e31b6e6c1e56b3e8c # v2.0.12

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup show
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-python@0a5c61591373683505ea898e09a6ea81b3051ad4 # v5.0.0
        with:
          python-version: "3.12"
      - name: Start dev services
        run: |
          docker compose -f deploy/dev/compose.yml up -d
          python3 deploy/dev/seed.py
      - name: Prepare runner sandbox dependencies
        run: |
          scripts/fetch-runsc.sh ~/.cache/loamz/runsc
          server/runner/rootfs/build.sh ~/.cache/loamz/rootfs
      - name: Build server and runner release binaries
        run: |
          cargo build --release --locked -p loamz-data-server -p loamz-runner
      - name: Install web dependencies and Chromium
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Seed sample data
        run: |
          python3 -m venv ~/.cache/loamz/modal-venv
          ~/.cache/loamz/modal-venv/bin/pip install duckdb==1.2.0
          scripts/dev.sh > /tmp/dev.log 2>&1 &
          DEV_PID=$!
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8020/readyz > /dev/null 2>&1; then break; fi
            sleep 1
          done
          scripts/sample_data.py 1
          kill $DEV_PID $(pgrep -P $DEV_PID 2>/dev/null) 2>/dev/null || true
          pkill -f "loamz-data serve" 2>/dev/null || true
          pkill -f "loamz-runner agent" 2>/dev/null || true
          pkill -f "vite" 2>/dev/null || true
      - name: Run E2E Playwright workflow tests
        run: |
          scripts/dev.sh > /tmp/dev.log 2>&1 &
          DEV_PID=$!
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8020/readyz > /dev/null 2>&1 && curl -fsS http://localhost:5180/ > /dev/null 2>&1; then break; fi
            sleep 1
          done
          pnpm --dir web test:e2e
      - name: Teardown stack
        if: always()
        run: |
          pkill -f "loamz-data serve" 2>/dev/null || true
          pkill -f "loamz-runner agent" 2>/dev/null || true
          pkill -f "vite" 2>/dev/null || true
