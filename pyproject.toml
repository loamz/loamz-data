# Virtual workspace root. Python here is only the embeddable engine (server/engine), which Loamz Agents builds against.
# The Data server itself is Rust (Cargo.toml). `uv run --package loamz-engine ...` runs the engine.
[tool.uv.workspace]
members = ["server/engine"]

# Indexes are read from the workspace root only.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
loamz-engine = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "import-linter>=2.11",
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
]

# One style for every loamz package (packages without their own [tool.ruff] inherit this).
[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in defaults

[tool.ruff.lint.isort]
known-first-party = ["loamz"]
